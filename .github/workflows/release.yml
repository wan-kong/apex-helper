name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' mygo.json)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Install Windows installer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis zip

      - name: Build Windows release
        run: go tool mygo build -platform windows/amd64

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' mygo.json)"
          cd dist/windows-amd64
          installer="Apex Runner Setup ${version}.exe"
          archive="ApexRunner-v${version}-windows-amd64.zip"
          test -s "$installer"
          test -s 'Apex Runner.exe'
          zip -q -9 "$archive" 'Apex Runner.exe' icon.png
          sha256sum "$installer" "$archive" > SHA256SUMS.txt
          test -s "$archive"
          test -s SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' mygo.json)"
          installer="dist/windows-amd64/Apex Runner Setup ${version}.exe"
          archive="dist/windows-amd64/ApexRunner-v${version}-windows-amd64.zip"
          sums="dist/windows-amd64/SHA256SUMS.txt"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$installer" "$archive" "$sums" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$installer" "$archive" "$sums" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
